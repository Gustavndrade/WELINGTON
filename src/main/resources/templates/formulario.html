<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${veiculo.id != null} ? 'Editar Veículo — Aluguel de Carros' : 'Novo Veículo — Aluguel de Carros'">
        Formulário — Aluguel de Carros
    </title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <h1>🚗 Sistema de Aluguel de Carros</h1>
    <p th:text="${veiculo.id != null} ? 'Editando veículo existente' : 'Cadastrando novo veículo'">
        Formulário de veículo
    </p>
</header>

<main>
    <div class="card">
        <h2 class="titulo-secao"
            th:text="${veiculo.id != null} ? 'Editar Veículo' : 'Novo Veículo'">
            Formulário
        </h2>

        <!-- Formulário com binding Thymeleaf -->
        <!-- th:action dinâmico: /veiculos (criação) ou /veiculos/{id} (edição) -->
        <form class="formulario"
              th:object="${veiculo}"
              th:action="${veiculo.id != null} ? @{/veiculos/{id}(id=${veiculo.id})} : @{/veiculos}"
              method="post">

            <!-- Campo id oculto para edição -->
            <input type="hidden" th:if="${veiculo.id != null}" th:value="${veiculo.id}" name="id">

            <!-- Modelo -->
            <div class="grupo-campo">
                <label for="modelo">Modelo *</label>
                <input type="text"
                       id="modelo"
                       th:field="*{modelo}"
                       th:class="${#fields.hasErrors('modelo')} ? 'campo-erro' : ''"
                       placeholder="Ex: Civic, Corolla, HB20">
                <span class="mensagem-erro" th:if="${#fields.hasErrors('modelo')}"
                      th:errors="*{modelo}">Erro no modelo</span>
            </div>

            <!-- Marca -->
            <div class="grupo-campo">
                <label for="marca">Marca *</label>
                <input type="text"
                       id="marca"
                       th:field="*{marca}"
                       th:class="${#fields.hasErrors('marca')} ? 'campo-erro' : ''"
                       placeholder="Ex: Honda, Toyota, Hyundai">
                <span class="mensagem-erro" th:if="${#fields.hasErrors('marca')}"
                      th:errors="*{marca}">Erro na marca</span>
            </div>

            <!-- Ano -->
            <div class="grupo-campo">
                <label for="ano">Ano *</label>
                <input type="number"
                       id="ano"
                       th:field="*{ano}"
                       th:class="${#fields.hasErrors('ano')} ? 'campo-erro' : ''"
                       placeholder="Ex: 2022"
                       min="1900"
                       max="2030">
                <span class="mensagem-erro" th:if="${#fields.hasErrors('ano')}"
                      th:errors="*{ano}">Erro no ano</span>
            </div>

            <!-- Placa -->
            <div class="grupo-campo">
                <label for="placa">Placa *</label>
                <input type="text"
                       id="placa"
                       th:field="*{placa}"
                       th:class="${#fields.hasErrors('placa')} ? 'campo-erro' : ''"
                       placeholder="Ex: ABC1234 ou ABC1D23"
                       maxlength="8">
                <span class="mensagem-erro" th:if="${#fields.hasErrors('placa')}"
                      th:errors="*{placa}">Erro na placa</span>
            </div>

            <!-- Valor da Diária -->
            <div class="grupo-campo">
                <label for="valorDiaria">Valor da Diária (R$) *</label>
                <input type="number"
                       id="valorDiaria"
                       th:field="*{valorDiaria}"
                       th:class="${#fields.hasErrors('valorDiaria')} ? 'campo-erro' : ''"
                       placeholder="Ex: 150.00"
                       step="0.01"
                       min="0.01">
                <span class="mensagem-erro" th:if="${#fields.hasErrors('valorDiaria')}"
                      th:errors="*{valorDiaria}">Erro no valor</span>
            </div>

            <!-- Disponibilidade -->
            <div class="grupo-campo">
                <label for="disponivel">Disponível para Aluguel *</label>
                <select id="disponivel"
                        th:field="*{disponivel}"
                        th:class="${#fields.hasErrors('disponivel')} ? 'campo-erro' : ''">
                    <option value="">— Selecione —</option>
                    <option value="true">Sim</option>
                    <option value="false">Não</option>
                </select>
                <span class="mensagem-erro" th:if="${#fields.hasErrors('disponivel')}"
                      th:errors="*{disponivel}">Erro na disponibilidade</span>
            </div>

            <!-- Botões -->
            <div class="grupo-botoes">
                <button type="submit" class="btn btn-primario">
                    💾 Salvar
                </button>
                <a th:href="@{/veiculos}" class="btn btn-secundario">
                    ✕ Cancelar
                </a>
            </div>

        </form>
    </div>
</main>

<footer>
    <p>Sistema de Aluguel de Carros — Desenvolvimento de Sistemas Web II</p>
</footer>

</body>
</html>
